name: Release

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - "release/v3.16.0"

jobs:
  build_plugin:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: set git global safe directory
        run: |
          pacman -Syu git npm tree zip unzip python --noconfirm
          git config --global --add safe.directory $(realpath .)

      - uses: actions/checkout@v4
        with:
          submodules: true
          ref: 8881a4248841e999de4fa417f6f391683d7268a0

      - name: Verify version and Intel RAPL regression tests
        run: |
          python -c 'import json; assert json.load(open("package.json"))["version"] == "3.16.0"'
          python -m py_compile py_modules/cpu.py tests/test_intel_rapl.py
          python -m unittest discover -s tests -p "test_intel_rapl.py" -v

      # - name: update submodules
      #   run: git submodule update --init --recursive

      - name: build static libpci
        run: |
          pacman -S base-devel binutils cmake curl tar --noconfirm --needed --overwrite='*'
          curl -fL -o /tmp/pciutils.tar.gz https://mj.ucw.cz/download/linux/pci/pciutils-3.14.0.tar.gz
          mkdir -p /tmp/pciutils /tmp/pci-static
          tar -xzf /tmp/pciutils.tar.gz -C /tmp/pciutils --strip-components=1
          make -C /tmp/pciutils \
            SHARED=no \
            ZLIB=no \
            DNS=no \
            LIBKMOD=no \
            HWDB=no \
            PREFIX=/tmp/pci-static \
            install-lib

      - name: build RyzenAdj
        run: |
          cd submodule/RyzenAdj
          sed -i 's|set(OS_LINK_LIBRARY pci)|include_directories(/tmp/pci-static/include)\nset(OS_LINK_LIBRARY /tmp/pci-static/lib/libpci.a)|' CMakeLists.txt
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make ryzenadj
          ldd ryzenadj || true
          readelf -d ryzenadj || true
          cp -f ryzenadj ../../../bin

      # - name: build python-fuse
      #   run: |
      #     PWD=$(pwd)
      #     echo "PWD: $PWD"
      #     mkdir -p py_modules/site-packages
      #     pacman -S python-fuse python-setuptools python-wheel python-installer rsync --noconfirm --needed --overwrite='*'
      #     cd ${PWD}/submodule/python-fuse && \
      #       PYTHONPATH=${PWD}/py_modules/site-packages \
      #       python3 setup.py install --prefix=${PWD} --install-lib=install
      #     cd -
      #     rsync -av --progress --exclude=*.pyc --exclude=__pycache__ ./submodule/python-fuse/install/fuse*/fuse* ./py_modules/site-packages/

      - name: change log level
        run: |
          sed -i 's/logging.DEBUG/logging.INFO/' py_modules/config.py

      - name: build plugin
        run: |
          npm i -g pnpm
          pnpm install --no-frozen-lockfile
          pnpm update
          pnpm run build
          rm -f dist/*.js.map
          tar -czvf PowerControl.tar.gz --transform 's,^,PowerControl/,' dist backend py_modules bin *.py *.json *.md *.js LICENSE
          # zip
          mkdir -p PowerControl
          cp -r dist backend py_modules bin *.py *.json *.md *.js LICENSE PowerControl
          zip -r PowerControl.zip PowerControl
          rm -rf PowerControl

      - name: show files
        run: |
          tar -tzvf PowerControl.tar.gz
          unzip -l PowerControl.zip
      - name: Verify packaged versions
        run: |
          python - <<'PY'
          import json, tarfile, zipfile
          with tarfile.open("PowerControl.tar.gz") as archive:
              assert json.load(archive.extractfile("PowerControl/package.json"))["version"] == "3.16.0"
          with zipfile.ZipFile("PowerControl.zip") as archive:
              assert json.loads(archive.read("PowerControl/package.json"))["version"] == "3.16.0"
          PY
      - name: Publish Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PowerControl
          path: |
            PowerControl.tar.gz
            PowerControl.zip

  publish:
    if: github.ref == 'refs/heads/release/v3.16.0'
    runs-on: ubuntu-latest
    needs: build_plugin
    steps:
      - run: mkdir /tmp/artifacts

      - name: download artifact
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts

      - run: ls -R /tmp/artifacts

      - name: publish to github release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /tmp/artifacts/PowerControl/PowerControl.tar.gz
            /tmp/artifacts/PowerControl/PowerControl.zip
          tag_name: v3.16.0
          target_commitish: 8881a4248841e999de4fa417f6f391683d7268a0
          fail_on_unmatched_files: true
          draft: false
          generate_release_notes: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
